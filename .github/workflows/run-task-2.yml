name: Run CSV Data Quality Auditor

on:
  push:
    paths:
      - "Task-2/**"
      - ".github/workflows/run-task-2.yml"
  pull_request:
    paths:
      - "Task-2/**"
      - ".github/workflows/run-task-2.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Task-2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sample data audit
        run: python data_quality_auditor.py

      - name: Run unit tests
        run: python -m unittest -v
